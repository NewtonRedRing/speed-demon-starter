name: B windowed hybrid full-seed comparison
on:
  pull_request:
    branches: [speed-demon]
    paths:
      - 'track-b/**'
      - '.github/workflows/b-windowed-hybrid-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'experiment/track-b-windowed-hybrid-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile protected baseline and MIT-licensed candidate
        run: |
          rustc --version
          git show origin/speed-demon:track-b/main.rs > /tmp/baseline.rs
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native -C panic=abort -C codegen-units=1 -o /tmp/baseline /tmp/baseline.rs
          rustc --edition=2024 -C opt-level=3 -C target-cpu=alderlake -C panic=abort -C codegen-units=1 -o /tmp/candidate track-b/main.rs
      - name: Generate official full seed 1
        run: |
          python3 track-b/pgo_gen.py --seed 1 --scale full --out /tmp/seed1
          sudo mkdir -p /data /out
          sudo ln -sf /tmp/seed1/docs.txt /data/docs.txt
          sudo ln -sf /tmp/seed1/queries.txt /data/queries.txt
          sudo chmod 777 /out
      - name: Require byte-exact reference output and compare runtime
        run: |
          python3 - <<'PY'
          import hashlib,random,statistics,subprocess,time
          expected="f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927"
          cmds=["/tmp/baseline","/tmp/candidate"]
          for cmd in cmds:
              subprocess.run([cmd],check=True)
              with open("/out/results.txt","rb") as f: got=hashlib.file_digest(f,"sha256").hexdigest()
              assert got==expected,(cmd,got,expected)
              print("FULL_SEED_SHA_PASS",cmd,got,flush=True)
          results={s:[] for s in cmds}
          rng=random.Random(20261102)
          for i in range(10):
              order=cmds[:];rng.shuffle(order)
              for cmd in order:
                  t=time.perf_counter()
                  subprocess.run([cmd],check=True)
                  results[cmd].append(1000*(time.perf_counter()-t))
          for cmd in cmds: print("MEDIAN_MS",cmd,statistics.median(results[cmd]),"SAMPLES_MS",results[cmd],flush=True)
          print("BASELINE_OVER_CANDIDATE",statistics.median(results[cmds[0]])/statistics.median(results[cmds[1]]),flush=True)
          PY
      - name: Peak RSS comparison (non-official)
        run: |
          /usr/bin/time -f 'BASE_MAX_RSS_KB %M' /tmp/baseline
          /usr/bin/time -f 'CAND_MAX_RSS_KB %M' /tmp/candidate
