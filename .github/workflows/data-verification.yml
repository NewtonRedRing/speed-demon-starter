name: Verify public input corpus
on:
  workflow_dispatch:
  push:
    branches: [speed-demon]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-data]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build optimized binaries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Download and verify public input checksums
        run: python3 scripts/download_data.py --engine all --dest data
      - name: Validate exact output hashes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          outputs = {
            "log_ingest": ("summary.txt", "495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3"),
            "text_search": ("results.txt", "f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927"),
            "csv_aggregate": ("aggregates.txt", "d8088b1cd42ba1338b1345b107b55db7b96ef1f5066f3ff64fd26a8912a0f536"),
            "shortest_path": ("distances.txt", "a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e"),
          }
          for engine, (file, expected) in outputs.items():
              subprocess.run([f"./build/{engine}", "--input-dir", f"data/{engine}",
                              "--output-dir", f"out/{engine}", "--threads", "4"],
                             check=True, timeout=360)
              actual = hashlib.sha256(pathlib.Path("out", engine, file).read_bytes()).hexdigest()
              print(engine, "expected", expected, "actual", actual, flush=True)
              if actual != expected:
                  raise SystemExit(f"{engine}: incorrect output hash")
          PY
      - name: Extract compact sample inputs
        if: always()
        run: |
          if test -f data/shortest_path/graph.txt; then
            python3 scripts/make_public_sample.py --source data --dest sample_data
          fi
      - name: Publish downloadable sample archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-input-samples
          path: sample_data/
          if-no-files-found: ignore
          retention-days: 7
