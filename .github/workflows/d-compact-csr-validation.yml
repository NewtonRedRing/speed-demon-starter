name: D compact CSR full-seed comparison
on:
  pull_request:
    branches: [speed-demon]
    paths:
      - 'track-d/**'
      - '.github/workflows/d-compact-csr-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'experiment/track-d-compact-csr-buckets-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile protected baseline and candidate
        run: |
          git show origin/speed-demon:track-d/main.rs > /tmp/d_base.rs
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native -C panic=abort -C codegen-units=1 -o /tmp/d_base /tmp/d_base.rs
          rustc --edition=2024 -C opt-level=3 -C target-cpu=alderlake -C panic=abort -C codegen-units=1 -o /tmp/d_cand track-d/main.rs
      - name: Generate full dataset using official generator
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/hackathon-raptors/speed-demon-2026/main/generators/d_traverse.py -o /tmp/gen_d.py
          python3 /tmp/gen_d.py --seed 1 --scale full --out /tmp/d_data
          sudo mkdir -p /data /out
          sudo ln -sf /tmp/d_data/graph.txt /data/graph.txt
          sudo ln -sf /tmp/d_data/queries.txt /data/queries.txt
          sudo chmod 777 /out
      - name: Exact SHA and matched benchmark runs
        run: |
          python3 - <<'PY'
          import hashlib,subprocess,random,time,statistics
          cmds=['/tmp/d_base','/tmp/d_cand']
          expected='a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
          for cmd in cmds:
              subprocess.run([cmd],check=True)
              with open('/out/distances.txt','rb') as f: got=hashlib.file_digest(f,'sha256').hexdigest()
              assert got==expected,(cmd,got,expected)
              print('FULL_SHA_PASS',cmd,got,flush=True)
          r={cmd:[] for cmd in cmds}
          rng=random.Random(20261102)
          for i in range(8):
              pair=cmds[:];rng.shuffle(pair)
              for cmd in pair:
                  t=time.perf_counter()
                  subprocess.run([cmd],check=True)
                  r[cmd].append(1000*(time.perf_counter()-t))
          for cmd in cmds: print('MEDIAN_MS',cmd,statistics.median(r[cmd]),'SAMPLES',r[cmd],flush=True)
          print('SPEEDUP',statistics.median(r[cmds[0]])/statistics.median(r[cmds[1]]),flush=True)
          PY
      - name: Peak RSS check
        run: |
          /usr/bin/time -f 'BASE_MAX_RSS_KB %M' /tmp/d_base
          /usr/bin/time -f 'CAND_MAX_RSS_KB %M' /tmp/d_cand
