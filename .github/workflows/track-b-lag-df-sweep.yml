name: Track B Rust scanner-lag and posting-density sweep
on:
  push:
    branches: [experiment/track-b-lag-df-sweep-20261102]
  pull_request:
    branches: [speed-demon]
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile independent optimized Rust variants
        run: |
          set -euo pipefail
          git show origin/speed-demon:track-b/main.rs > /tmp/b_base.rs
          python3 - <<'PY'
          import pathlib,subprocess
          src=pathlib.Path('/tmp/b_base.rs').read_text()
          assert 'const LAG: usize = 8;' in src
          assert 'df[i] as usize * 32 <= sampled' in src
          specs=[('base',8,32),('lag4',4,32),('lag6',6,32),('lag10',10,32),('lag12',12,32),('lag16',16,32),('density16',8,16),('density24',8,24),('density48',8,48),('density64',8,64)]
          pathlib.Path('/tmp/b_variants.txt').write_text('\n'.join(x[0] for x in specs)+'\n')
          for name,lag,density in specs:
              src1=src.replace('const LAG: usize = 8;',f'const LAG: usize = {lag};').replace('df[i] as usize * 32 <= sampled',f'df[i] as usize * {density} <= sampled')
              p=pathlib.Path('/tmp/b_'+name+'.rs'); p.write_text(src1)
              subprocess.run(['rustc','--edition=2021','-C','opt-level=3','-C','target-cpu=haswell','-C','codegen-units=1','-C','panic=abort','-o','/tmp/b_'+name,str(p)],check=True)
              print('BUILT',name,'lag',lag,'sparse_cutoff',density,flush=True)
          PY
      - name: Validate exact generated multi-seed outputs
        run: |
          set -euo pipefail
          sudo install -d -m 777 /out
          for seed in 2 17 42 2026; do
            python3 track-b/pgo_gen.py --seed "$seed" --scale tiny --out "/tmp/b-tiny-$seed"
            sudo ln -sfn "/tmp/b-tiny-$seed" /data
            /tmp/b_base
            cp /out/results.txt /tmp/b_expected
            while read -r variant; do
              /tmp/b_"$variant"
              cmp /tmp/b_expected /out/results.txt
            done </tmp/b_variants.txt
            echo "PASS tiny seed=$seed"
          done
          python3 track-b/pgo_gen.py --seed 103 --scale sample --out /tmp/b-sample
          sudo ln -sfn /tmp/b-sample /data
          /tmp/b_base
          cp /out/results.txt /tmp/b_expected
          while read -r variant; do
            /tmp/b_"$variant"
            cmp /tmp/b_expected /out/results.txt
          done </tmp/b_variants.txt
          echo "PASS sample 103"
          python3 track-b/pgo_gen.py --seed 1 --scale full --out /tmp/b-full
          sudo ln -sfn /tmp/b-full /data
          /tmp/b_base
          cp /out/results.txt /tmp/b_expected
          echo "FULL_BASELINE_SHA $(sha256sum /out/results.txt)"
          while read -r variant; do
            /tmp/b_"$variant"
            cmp /tmp/b_expected /out/results.txt
            echo "PASS full $variant"
          done </tmp/b_variants.txt
      - name: Twelve randomized interleaved full corpus timings
        run: |
          python3 - <<'PY'
          import random,subprocess,time,statistics
          names=open('/tmp/b_variants.txt').read().split()
          xs={name:[] for name in names}
          for i in range(12):
              order=names.copy()
              random.Random(20261102+i*317).shuffle(order)
              for name in order:
                  t=time.perf_counter()
                  subprocess.run(['/tmp/b_'+name],check=True,stdout=subprocess.DEVNULL)
                  xs[name].append(1000*(time.perf_counter()-t))
          base=statistics.median(xs['base'])
          for name in sorted(names,key=lambda x:statistics.median(xs[x])):
              med=statistics.median(xs[name])
              print(f'VARIANT {name} median_ms={med:.3f} ratio={med/base:.5f} samples='+str([round(t,2) for t in xs[name]]),flush=True)
          PY
      - name: Peak RSS for each variant
        run: |
          while read -r name; do
            /usr/bin/time -f "RSS_KB $name %M" /tmp/b_"$name"
          done </tmp/b_variants.txt
