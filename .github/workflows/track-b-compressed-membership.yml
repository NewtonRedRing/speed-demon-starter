name: Track B compressed-postings membership A/B
on:
  pull_request:
    paths:
      - "track-b/main.rs"
      - ".github/workflows/track-b-compressed-membership.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile baseline and candidate Rust on runner
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          git fetch --no-tags --depth=1 origin ae44f84fab34eada896a4276996f792949b31e83
          git show ae44f84fab34eada896a4276996f792949b31e83:track-b/main.rs > /tmp/baseline.rs
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native -C panic=abort -C codegen-units=1 -o /tmp/baseline /tmp/baseline.rs
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native -C panic=abort -C codegen-units=1 -o /tmp/candidate track-b/main.rs
          sudo mkdir -p /data /out
          sudo chown "$USER" /data /out
      - name: Verify exact output against original across sample and tiny seeds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, statistics, subprocess, time
          root = pathlib.Path('/data')
          out = pathlib.Path('/out/results.txt')
          for seed, scale, repetitions in [(17, 'sample', 8), (2, 'tiny', 1), (7, 'tiny', 1), (42, 'tiny', 1), (2026, 'tiny', 1)]:
              subprocess.run(['python3','track-b/pgo_gen.py','--seed',str(seed),'--scale',scale,'--out','/data'],check=True)
              timings = {name: [] for name in ('baseline','candidate')}
              digest = None
              for j in range(repetitions):
                  for name in (('baseline','candidate') if j%2==0 else ('candidate','baseline')):
                      out.unlink(missing_ok=True)
                      t0=time.perf_counter()
                      subprocess.run(['/tmp/'+name], check=True)
                      ms=(time.perf_counter()-t0)*1000
                      data=out.read_bytes()
                      assert data and data.endswith(b'\n'), (seed,scale,name)
                      h=hashlib.sha256(data).hexdigest()
                      if digest is None: digest=h
                      assert h==digest,(seed,scale,name,digest,h)
                      timings[name].append(ms)
              print(f'{scale} seed={seed}: exact SHA256={digest}; baseline median={statistics.median(timings["baseline"]):.2f} ms; candidate median={statistics.median(timings["candidate"]):.2f} ms',flush=True)
          print('PASS: exact baseline agreement on 5 generated seed/scale combinations')
          PY
      - name: Official full input SHA and 12 paired exact-output A/B trials
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 2 https://s3.amazonaws.com/raptors.dev/speeddemon.dev/2026/data/track-b/full-seed1/docs.txt -o /data/docs.txt
          curl -fLsS --retry 4 --retry-delay 2 https://s3.amazonaws.com/raptors.dev/speeddemon.dev/2026/data/track-b/full-seed1/queries.txt -o /data/queries.txt
          echo "6cd461670d6c39f9c5211162577532d3648edeab12340c71cc7d2ab5f18e66c8  /data/docs.txt" | sha256sum -c -
          echo "77ef7ffc59afde051006b02a2ce8e4c090fbbfbf101acd6f862d0f8e298d39f9  /data/queries.txt" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, pathlib, statistics, subprocess, time
          expected='f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927'
          out=pathlib.Path('/out/results.txt')
          a,b=[],[]
          for j in range(12):
              for name in (('baseline','candidate') if j%2==0 else ('candidate','baseline')):
                  out.unlink(missing_ok=True)
                  t=time.perf_counter()
                  subprocess.run(['/tmp/'+name],check=True)
                  ms=(time.perf_counter()-t)*1000
                  digest=hashlib.sha256(out.read_bytes()).hexdigest()
                  assert digest==expected,('OFFICIAL OUTPUT MISMATCH',j,name,digest)
                  (a if name=='baseline' else b).append(ms)
          print('OFFICIAL_FULL_SHA256_PASS',expected,flush=True)
          print('FULL_PUBLIC_BASELINE_MEDIAN_MS',statistics.median(a),flush=True)
          print('FULL_PUBLIC_CANDIDATE_MEDIAN_MS',statistics.median(b),flush=True)
          print('FULL_PUBLIC_RATIO_BASE_OVER_CAND',statistics.median(a)/statistics.median(b),flush=True)
          print('PAIRED_FASTER_COUNT',sum(x>y for x,y in zip(a,b)),'of',len(a),flush=True)
          PY
      - name: Threshold sweep for adaptive compressed postings (full official SHA)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('track-b/main.rs').read_text()
          assert source.count('v.len() <= 32')==1
          assert source.count('n >= v.len() * 32')==1
          variants=[(8,8),(16,16),(32,32),(64,16),(64,64),(128,16)]
          for maxlen,ratio in variants:
              changed=source.replace('v.len() <= 32',f'v.len() <= {maxlen}').replace('n >= v.len() * 32',f'n >= v.len() * {ratio}')
              name=f'b{maxlen}r{ratio}'
              Path('/tmp/'+name+'.rs').write_text(changed)
              subprocess.run(['rustc','--edition=2021','-C','opt-level=3',
                  '-C','target-cpu=native','-C','panic=abort','-C','codegen-units=1',
                  '-o','/tmp/'+name,'/tmp/'+name+'.rs'],check=True)
              print('COMPILED_VARIANT',name,flush=True)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, statistics, subprocess, time
          variants=['baseline','b8r8','b16r16','b32r32','b64r16','b64r64','b128r16']
          times={v:[] for v in variants}
          expected='f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927'
          out=Path('/out/results.txt')
          for trial in range(8):
              order=variants if trial%2==0 else variants[::-1]
              for name in order:
                  out.unlink(missing_ok=True)
                  t=time.perf_counter()
                  subprocess.run(['/tmp/'+name],check=True,stdout=subprocess.DEVNULL)
                  elapsed=(time.perf_counter()-t)*1000
                  digest=hashlib.sha256(out.read_bytes()).hexdigest()
                  assert digest==expected,(name,trial,digest)
                  times[name].append(elapsed)
          baseline=statistics.median(times['baseline'])
          for name in variants:
              m=statistics.median(times[name])
              wins=sum(a>b for a,b in zip(times['baseline'],times[name]))
              print('SWEEP_FULL',name,'median_ms',round(m,3),'ratio_base_over',round(baseline/m,5),
                    'paired_wins',wins,'of',len(times[name]),'sha_pass',flush=True)
          PY
