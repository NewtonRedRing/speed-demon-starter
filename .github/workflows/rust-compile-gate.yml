name: Rust compile gate
on:
  push:
    branches: [speed-demon]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile A
        run: rustc --edition=2021 -C opt-level=2 track-a/main.rs -o /tmp/a
      - name: Compile B
        run: rustc --edition=2021 -C opt-level=2 track-b/main.rs -o /tmp/b
      - name: Compile C
        run: rustc --edition=2021 -C opt-level=2 track-c/main.rs -o /tmp/c
      - name: Compile D
        run: rustc --edition=2021 -C opt-level=2 track-d/main.rs -o /tmp/d
