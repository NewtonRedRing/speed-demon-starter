name: A packed hour runs full-seed comparison
on:
  pull_request:
    branches: [speed-demon]
    paths:
      - 'track-a/**'
      - '.github/workflows/a-packed-hour-runs-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'experiment/track-a-packed-hour-runs-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile baseline and candidate
        run: |
          rustc --version
          git show origin/speed-demon:track-a/main.rs > /tmp/a_baseline.rs
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native -C panic=abort -C codegen-units=1 -o /tmp/a_baseline /tmp/a_baseline.rs
          rustc --edition=2024 -C opt-level=3 -C target-cpu=alderlake -C panic=abort -C codegen-units=1 -o /tmp/a_candidate track-a/main.rs
      - name: Generate official full seed 1
        run: |
          python3 track-a/pgo_gen.py --seed 1 --scale full --out /tmp/a_input
          sudo mkdir -p /data /out
          sudo ln -sf /tmp/a_input/requests.log /data/requests.log
          sudo chmod 777 /out
      - name: Verify reference hash and paired whole-process times
        run: |
          python3 - <<'PY'
          import hashlib,random,statistics,subprocess,time
          cmds=["/tmp/a_baseline","/tmp/a_candidate"]
          expected="495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3"
          for cmd in cmds:
              subprocess.run([cmd],check=True)
              with open("/out/summary.txt","rb") as f: h=hashlib.file_digest(f,"sha256").hexdigest()
              assert h==expected,(cmd,h,expected)
              print("FULL_SHA_PASS",cmd,h,flush=True)
          data={cmd:[] for cmd in cmds}
          rng=random.Random(20261102)
          for i in range(10):
              order=cmds[:];rng.shuffle(order)
              for cmd in order:
                  t=time.perf_counter()
                  subprocess.run([cmd],check=True)
                  data[cmd].append(1000*(time.perf_counter()-t))
          for cmd in cmds: print("MEDIAN_MS",cmd,statistics.median(data[cmd]),"SAMPLES",data[cmd],flush=True)
          print("SPEEDUP",statistics.median(data[cmds[0]])/statistics.median(data[cmds[1]]),flush=True)
          PY
      - name: Memory (nonofficial RSS)
        run: |
          /usr/bin/time -f 'BASE_MAX_RSS_KB %M' /tmp/a_baseline
          /usr/bin/time -f 'CAND_MAX_RSS_KB %M' /tmp/a_candidate
