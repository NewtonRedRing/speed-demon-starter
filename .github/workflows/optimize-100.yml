name: 100 exact-output trials per track

on:
  push:
    branches: [experiment/100-trial-score-search-20261031]
    paths:
      - "scripts/optimize_100.py"
      - "scripts/fetch_data.py"
      - "track-*/src/main.cpp"
      - "track-*/Dockerfile"
      - ".github/workflows/optimize-100.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 100-trial-speed-demon
  cancel-in-progress: false

jobs:
  tune:
    name: 100 candidates / Track ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        track: [a, b, c, d]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compiler, Docker, machine diagnostics
        run: |
          g++ --version | head -1
          docker --version
          nproc
      - name: Fetch and verify official seed-1 full input
        run: python3 scripts/fetch_data.py --tracks "${{ matrix.track }}"
      - name: Run exactly 100 compiler/runtime configurations
        run: |
          python3 scripts/optimize_100.py \
            --tracks "${{ matrix.track }}" \
            --engine docker \
            --finalists 8 --final-reps 5 \
            --apply \
            --report ".tuning/report.json"
      - name: Build/test selected image with pinned GCC 15
        run: |
          set -euo pipefail
          docker pull 'gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce'
          docker pull 'debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad'
          docker pull 'python:3.13-slim@sha256:d98cc29d3266e535dd9da1099688d9cb3ca4753813571e071763d17725460962'
          expected=$(python3 -c 'import json; print(json.load(open("data/SHA256SUMS.json"))["tracks"]["${{ matrix.track }}"]["expected_output_sha256"][0])')
          python3 check.py "${{ matrix.track }}" \
            --data "data/${{ matrix.track }}/full-seed1" --expected "$expected"
      - name: Preserve tuning report and candidate Dockerfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuned-track-${{ matrix.track }}
          path: |
            .tuning/report.json
            track-${{ matrix.track }}/Dockerfile
          if-no-files-found: warn

  promote-verified:
    # Commits selected settings only if ALL four correctness checks succeeded.
    needs: tune
    if: needs.tune.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/100-trial-score-search-20261031
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tuned-track-*
          path: .tuning/downloaded
      - name: Promote only SHA-verified candidate Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          for track in a b c d; do
            file=".tuning/downloaded/tuned-track-$track/track-$track/Dockerfile"
            test -f "$file"
            cp "$file" "track-$track/Dockerfile"
          done
          git diff --check
          git add track-{a,b,c,d}/Dockerfile
          if git diff --cached --quiet; then
            echo "No selected configurations beat the conservative local proxy gate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote SHA-verified local 100-trial configuration winners"
          git push origin HEAD:experiment/100-trial-score-search-20261031
