name: Official full public seed-1 correctness
on:
  push:
    branches:
      - speed-demon
  workflow_dispatch:
jobs:
  full-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    # GitHub's small runner cannot emulate the official 12 P-core CPU set.
    # Only CPU placement is changed; input/output hashes stay EXACTLY official.
    env:
      SPEED_DEMON_CPUSET_CPUS: "0-3"
    steps:
      - uses: actions/checkout@v4
      - name: Pull the contest's digest-pinned Docker base images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          images = set()
          for path in sorted(Path().glob("track-*/Dockerfile")):
              for line in path.read_text().splitlines():
                  words = line.split()
                  if len(words) >= 2 and words[0].upper() == "FROM":
                      image = words[1]
                      if "@sha256:" in image:
                          images.add(image)
          if not images:
              raise SystemExit("No pinned Docker base images")
          for image in sorted(images):
              print("pull", image, flush=True)
              subprocess.run(["docker", "pull", image], check=True)
          PY
      - name: Download the ORIGINAL full public dataset for A B C D
        shell: bash
        run: |
          set -euo pipefail
          python3 official_data.py download
          python3 official_data.py verify
      - name: Build offline and verify all four official output hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 check.py all
