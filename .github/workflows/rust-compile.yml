name: Rust compile gate

on:
  push:
    branches: [speed-demon]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all tracks
        shell: bash
        run: |
          set -euxo pipefail
          rustc --version
          for t in a b c d; do
            echo "::group::track-$t"
            rustc --edition=2024 -C opt-level=3 -C target-cpu=native -C panic=abort -o "/tmp/track-$t" "track-$t/main.rs"
            echo "::endgroup::"
          done
